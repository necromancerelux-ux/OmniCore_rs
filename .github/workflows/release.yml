jobs:
  build:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Check
        run: cargo test --locked --no-default-features

      - name: Build
        run: cargo build --locked --release --no-default-features

      - name: Package
        run: |
          cp target/release/omnicore omnicore-linux-arm64
          tar -cf omnicore-linux-arm64.tar omnicore-linux-arm64

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            omnicore-linux-arm64
            omnicore-linux-arm64.tar

      - uses: actions/upload-artifact@v4
        with:
          name: omnicore-linux-arm64
          path: |
            omnicore-linux-arm64
            omnicore-linux-arm64.tar
