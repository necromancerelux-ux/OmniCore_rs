name: build-release
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
      - name: Install musl toolchain
        run: sudo apt-get update && sudo apt-get install -y musl-tools pkg-config
      - name: Check
        run: cargo test --locked --no-default-features
      - name: Build
        # --no-default-features drops the Chromium capture (a panel can't run a browser).
        run: cargo build --locked --release --target x86_64-unknown-linux-musl --no-default-features
      - name: Package
        run: |
          cp target/x86_64-unknown-linux-musl/release/omnicore omnicore-linux-x86_64
          gzip -9 -k omnicore-linux-x86_64
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: omnicore-linux-x86_64.gz
      - uses: actions/upload-artifact@v4
        with:
          name: omnicore-linux-x86_64
          path: omnicore-linux-x86_64.gz
